# Builds the Windows installer and the macOS DMGs (Intel + Apple Silicon) on clean CI machines.
# macOS packages can only be built on macOS, so this workflow is how the Mac version is produced.
# Push a tag like v1.2.0 to build everything and publish a GitHub Release with the installers attached.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run ${{ matrix.script }}
        env:
          # Optional signing secrets (not configured yet):
          # macOS: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          # Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: manage-with-bunny-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" *.exe *.dmg SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --title "Manage with Bunny ${GITHUB_REF_NAME}" \
            --notes "Windows: Manage-with-Bunny-Setup-*.exe. Mac: arm64 for Apple Silicon, x64 for Intel. Not code-signed yet: see README.html for first-run steps. Verify downloads with SHA256SUMS.txt."
