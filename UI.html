<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage with Bunny - UI</title>
<meta name="description" content="A tour of every screen in Manage with Bunny.">
<link rel="icon" href="assets/logo.png">
<style>
@font-face { font-family: 'Inter'; src: url('assets/fonts/Inter-Medium.ttf') format('truetype'); font-weight: 400 600; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('assets/fonts/Inter-ExtraBold.ttf') format('truetype'); font-weight: 700 900; font-display: swap; }
@font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-display: swap; }
:root { --grad: linear-gradient(100deg, #1F6BFF 0%, #6A2BFF 30%, #FF1F56 65%, #FF8A00 100%); --ink: #F4F3F1; --mute: rgba(244,243,241,.66); --dim: rgba(244,243,241,.44); --line: rgba(255,255,255,.09); --card: rgba(255,255,255,.035); }
* { box-sizing: border-box; }
body { margin: 0; background: #08080A; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; }
a { color: #8DB4FF; text-decoration: none; }
.gr { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
header { display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(8,8,10,.85); backdrop-filter: blur(12px); z-index: 5; }
header img { width: 34px; height: 34px; }
header h1 { margin: 0; font-size: 20px; letter-spacing: -.035em; font-weight: 800; }
header .sp { flex: 1; }
header a.b { padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); color: #fff; font-weight: 700; font-size: 14px; }
header a.b.p { background: var(--grad); border: 0; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 71px); }
aside { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; position: sticky; top: 71px; height: calc(100vh - 71px); overflow: auto; }
aside .grp { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding: 14px 12px 6px; }
aside button { text-align: left; border: 0; background: none; color: var(--mute); padding: 10px 12px; border-radius: 11px; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px; position: relative; }
aside button:hover { background: rgba(255,255,255,.05); color: var(--ink); }
aside button.on { background: rgba(255,255,255,.09); color: var(--ink); }
aside button.on::before { content: ''; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad); }
main { padding: 34px 40px 60px; }
main h2 { font-size: clamp(30px, 3.4vw, 44px); letter-spacing: -.05em; margin: 0 0 10px; font-weight: 800; }
main p.d { color: var(--mute); max-width: 820px; font-size: 17px; line-height: 1.6; margin: 0 0 18px; }
.points { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.points span { font-size: 13px; padding: 5px 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); color: var(--mute); }
.frame { border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 100px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03); background: #0B0B0F; }
.frame .bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #121217; border-bottom: 1px solid var(--line); }
.frame .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2a2a31; }
.frame .bar span { margin-left: 10px; font-size: 12px; color: var(--dim); }
.frame img { display: block; width: 100%; height: auto; }
.nav { display: flex; justify-content: space-between; margin-top: 18px; }
.nav button { border: 1px solid rgba(255,255,255,.16); background: var(--card); color: #fff; padding: 10px 16px; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 700; }
.nav button:disabled { opacity: .3; cursor: default; }
footer { text-align: center; color: var(--dim); font-size: 13px; padding: 30px; border-top: 1px solid var(--line); }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } aside .grp { display: none; } main { padding: 24px 16px; } }
</style>
</head>
<body>
<header>
  <img src="assets/logo.png" alt="">
  <h1>Manage with <span class="gr">Bunny</span> &middot; UI tour</h1>
  <span class="sp"></span>
  <a class="b" href="README.html">Read me</a>
  <a class="b p" href="https://github.com/uday629/manage-with-bunny/releases/latest">Download</a>
</header>
<div class="layout">
  <aside id="list"></aside>
  <main>
    <h2 id="title"></h2>
    <p class="d" id="text"></p>
    <div class="points" id="points"></div>
    <div class="frame"><div class="bar"><i></i><i></i><i></i><span id="cap">Manage with Bunny</span></div><img id="shot" alt=""></div>
    <div class="nav"><button id="prev">Previous</button><button id="next">Next</button></div>
  </main>
</div>
<footer>Real screenshots from the automated end-to-end test (host and member apps running side by side). Made by Bunnys Framelab · <a href="https://framelabmedia.odoo.com/">framelabmedia.odoo.com</a> · <a href="https://www.instagram.com/bunnysframelab/">@bunnysframelab</a></footer>
<script>
const S = [
  ['Getting started', 'welcome', 'Welcome', 'The first screen. One computer chooses Host a workspace; everyone else chooses Join a team.', ['No cloud account', 'Works on your Wi-Fi only']],
  ['Getting started', 'host-setup', 'Host a workspace', 'The owner names the workspace, creates the owner account and picks a storage drive. A drive other than C: is suggested automatically.', ['Password strength meter', 'Encryption keys created on this computer']],
  ['Getting started', 'join-found', 'Join a team', 'A teammate pastes the invite. The app finds the host on the Wi-Fi and verifies its identity before anything is sent.', ['Code + address invite', 'Identity check against fake hosts']],
  ['Getting started', 'pending', 'Waiting for approval', 'New people wait here until the owner approves them and sets their role. It continues by itself.', ['Admin approval for everyone']],
  ['Every day', 'home', 'Home', 'Your day at a glance: open tasks, work waiting for your review, your monthly score, the team, and (on the host) the invite.', ['Copy invite', 'Remote teammates card']],
  ['Every day', 'chat', 'Chat', 'Direct messages are end-to-end encrypted. Groups, files, voice messages, replies, edits, seen ticks and typing indicators.', ['Voice messages', 'Seen / not seen', 'Big files stream inline']],
  ['Every day', 'search', 'Message search', 'Search chats and messages in Bengali or English; click a result to jump straight to that message.', ['Full-text index', 'Private chats searched on your own device']],
  ['Every day', 'voice', 'Voice messages', 'Click the microphone, talk, send. Plays inline with a progress wave.', ['Up to 10 minutes', 'Opus audio, tiny files']],
  ['Every day', 'tasks', 'Task pipeline', 'Assign, start, submit with files, request changes, approve. Delegate parts further down the chain. Filter by month, export to Excel or PDF.', ['Full history', 'Excel / PDF export']],
  ['Every day', 'task', 'Task details', 'Everything about one task: who, when, files, delegated subtasks and the full activity history.', ['Request changes needs a note', 'Approve in one click']],
  ['Team', 'team', 'Team chart', 'A tree of who works under whom. Remote teammates are marked. Click anyone for their profile.', ['Each person sees their own part']],
  ['Team', 'remote-task', 'Remote teammates', 'A caretaker moves a remote teammate\'s tasks forward on their behalf. The history shows exactly who did what for whom.', ['No login needed', 'Activate later with a code']],
  ['Team', 'worklog', 'Work log', 'Daily updates with hours, notes and links. Counted in monthly performance.', ['Export to Excel / PDF']],
  ['Team', 'files', 'Files', 'Every file shared in your chats and tasks, with previews, versions and downloads.', ['Versions', 'Duplicates stored once']],
  ['Team', 'records', 'Records', 'Private sheets for work handed out, hiring, expenses or leads. Share with chosen people only.', ['Excel / PDF / CSV']],
  ['Team', 'analytics', 'Performance', 'Monthly scores, on-time rate, overdue work, logged hours and reviews for everyone you manage.', ['12-month history', 'Manager reviews']],
  ['Admin', 'members', 'Members', 'Approve join requests, change roles and managers, add remote profiles, reset passwords, sign people out.', ['Escalation protection']],
  ['Admin', 'roles', 'Roles & permissions', 'Create any position your team has and choose exactly what it can do.', ['12 permissions', 'Cannot grant more than you have']],
  ['Admin', 'storage', 'Storage', 'Disk usage, de-duplication savings, old versions, cleanup, daily backups and moving storage to another drive.', ['One-click cleanup', 'Daily backups']],
  ['Admin', 'netcheck', 'Network check', 'Explains why someone cannot connect and repairs the firewall in one click.', ['AP isolation detection', 'Firewall repair']],
  ['Admin', 'settings', 'Settings & about', 'Profile, password, signed-in devices, start with the computer, keep running in the tray, and links to Bunnys Framelab.', ['Made by Bunnys Framelab']],
];
let cur = 0;
const list = document.getElementById('list');
let lastGrp = '';
S.forEach((s, i) => {
  if (s[0] !== lastGrp) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = s[0]; list.appendChild(g); lastGrp = s[0]; }
  const b = document.createElement('button'); b.textContent = s[2]; b.onclick = () => show(i); list.appendChild(b);
});
function show(i) {
  cur = i; const s = S[i];
  document.getElementById('title').textContent = s[2];
  document.getElementById('text').textContent = s[3];
  document.getElementById('cap').textContent = 'Manage with Bunny - ' + s[2];
  const img = document.getElementById('shot'); img.src = 'docs/screenshots/' + s[1] + '.png'; img.alt = s[2] + ' screen';
  const p = document.getElementById('points'); p.textContent = ''; s[4].forEach((t) => { const x = document.createElement('span'); x.textContent = t; p.appendChild(x); });
  [...list.querySelectorAll('button')].forEach((b, j) => b.classList.toggle('on', j === i));
  document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === S.length - 1;
  history.replaceState(null, '', '#' + s[1]);
}
document.getElementById('prev').onclick = () => show(Math.max(0, cur - 1));
document.getElementById('next').onclick = () => show(Math.min(S.length - 1, cur + 1));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') show(Math.min(S.length - 1, cur + 1)); if (e.key === 'ArrowLeft') show(Math.max(0, cur - 1)); });
const start = S.findIndex((s) => '#' + s[1] === location.hash);
show(start >= 0 ? start : 0);
</script>
</body>
</html>
